# Wapsi UI settings. Streamlit reads this file when it sits next to the main script (current releases and
# Streamlit in Snowflake, where ui/ is the app root). Per-mode accents keep "Use system setting" working, so
# the app follows the viewer's light / dark choice. (Versions before per-mode themes ignore these two
# sections with a log warning and keep Streamlit's default theme.)
[theme.light]
primaryColor = "#256abf"

[theme.dark]
primaryColor = "#3987e5"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
