# Streamlit in Snowflake (warehouse runtime): packages from the Snowflake Anaconda channel only.
# Keep in sync with editions/snowflake/snowpark/build_zip.py APP_PACKAGES (tested).
name: sf_env
channels:
  - snowflake
dependencies:
  - python=3.11
  - streamlit
  - snowflake-snowpark-python
  - pydantic
  - pandas
  - numpy
  - jinja2
  - plotly
